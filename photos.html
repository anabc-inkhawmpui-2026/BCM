
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Photo Gallery | BCM ABC</title>

    <link rel="stylesheet" href="photos.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>

/* General */
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #F4F7FA;
    color: #263747;
}

/* Gallery Header */
.gallery-header {
    position: relative;
    background: #0360ac;
    color: white;

    padding: 22px 20px;
    min-height: 125px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-bottom: 3px solid #8CC9F5;
}

/* Back Button */
.back-button {
    position: absolute;
    left: 12px;
    top: 12px;

    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;

    color: white;
    text-decoration: none;

    background: #03447F;
    border: 1px solid #B7DFFF;
    border-radius: 7px;

    padding: 8px 10px;
    font-size: 14px;
}

.back-button:hover {
    background: #023565;
}

/* Logo and Header Text */
.header-content {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;

    margin-top: 25px;
}

/* Logo */
.gallery-header img {
    width: 55px;
    height: 55px;
    object-fit: contain;
    flex-shrink: 0;
}

/* Header Text */
.header-text {
    text-align: left;
}

.gallery-header p {
    font-size: 11px;
    letter-spacing: 1px;
    margin: 0 0 5px;
    color: #DCEEFF;
}

.gallery-header h1 {
    margin: 0 0 3px;
    font-size: 25px;
}

.gallery-header span {
    color: #DCEEFF;
    font-size: 13px;
}

/* Main Gallery Container */
.gallery-container {
    max-width: 950px;
    margin: auto;
    padding: 35px 20px 55px;
}

/* Gallery Grid */
.gallery-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
}

/* Entire Clickable Card */
.gallery-card {
    background: white;
    border: 1px solid #D6E5F2;
    border-radius: 12px;

    padding: 24px;
    min-height: 200px;

    display: flex;
    flex-direction: column;
    align-items: flex-start;

    text-decoration: none;
    color: inherit;

    box-shadow: 0 3px 12px rgba(0,0,0,0.04);

    transition: transform 0.2s ease,
                box-shadow 0.2s ease,
                border-color 0.2s ease;
}

/* Card Hover */
.gallery-card:hover {
    transform: translateY(-4px);
    border-color: #62B2F3;
    box-shadow: 0 6px 18px rgba(3,96,172,0.12);
}

/* Gallery Icon */
.gallery-icon {
    width: 46px;
    height: 46px;

    border-radius: 10px;
    background: #E5F1FC;
    color: #0360AC;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 22px;
    margin-bottom: 14px;
}

/* Card Heading */
.gallery-card h3 {
    color: #03447F;
    margin: 0 0 8px;
}

/* Card Description */
.gallery-card p {
    color: #687B8C;
    font-size: 14px;
    line-height: 1.5;
    margin: 0 0 20px;
}

/* Explore Text */
.gallery-explore {
    margin-top: auto;

    color: #687B8C;
    font-size: 14px;
    font-weight: 600;

    display: inline-flex;
    align-items: center;
    gap: 8px;
}

.gallery-card:hover .gallery-explore {
    color: #023565;
}

/* Keyboard Accessibility */
.gallery-card:focus-visible,
.back-button:focus-visible {
    outline: 3px solid #62B2F3;
    outline-offset: 4px;
}

/* Footer */
footer {
    text-align: center;
    background: #03447F;
    color: white;

    padding: 25px 15px;
    font-size: 13px;
}

footer p {
    color: #DCEEFF;
}

/* Mobile Responsive */
@media (max-width: 550px) {

    .gallery-grid {
        grid-template-columns: 1fr;
    }

    .gallery-header {
        min-height: 115px;
        padding: 18px 12px;
    }

    .header-content {
        gap: 10px;
        margin-top: 27px;
    }

    .gallery-header img {
        width: 42px;
        height: 42px;
    }

    .gallery-header p {
        font-size: 9px;
        letter-spacing: 0.5px;
    }

    .gallery-header h1 {
        font-size: 21px;
    }

    .gallery-header span {
        font-size: 12px;
    }

    .back-button {
        top: 8px;
        left: 10px;
        padding: 6px 10px;
        font-size: 12px;
    }

    .gallery-card {
        min-height: 180px;
    }
}

    </style>
</head>
